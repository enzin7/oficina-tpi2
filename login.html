<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Oficina Torque Certo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Oficina Torque Certo — Sistema Administrativo</h1>
  </header>
  <main class="login">
    <h2>Entrar no sistema</h2>
    <form id="form-login" novalidate>
      <label class="inteiro">Usuário<input type="text" name="login" autocomplete="username" required autofocus></label>
      <label class="inteiro">Senha<input type="password" name="senha" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button>
    </form>
    <div id="resultado"></div>
  </main>
  <footer>TPI II · Enzo Mota Torquette e Higor Costa Valle Marquez Chagas</footer>
  <script src="js/app.js"></script>
</body>
</html>
